name: Build and Deploy to Cloud Run

on:
  push:
    branches:
      - main  # Adjust to your default branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        service_account_key: ${{ secrets.GCP_SA_KEY }}
        project_id: ${{ secrets.GCP_PROJECT_ID }}

    - name: Configure Docker to use gcloud as a credential helper
      run: gcloud auth configure-docker

    - name: Build Docker image
      run: docker build -t gcr.io/${{ secrets.GCP_PROJECT_ID }}/healthcare-ai-app:${{ github.sha }} .

    - name: Push Docker image to GCR
      run: docker push gcr.io/${{ secrets.GCP_PROJECT_ID }}/healthcare-ai-app:${{ github.sha }}

    - name: Deploy to Cloud Run
      run: |
        gcloud run deploy healthcare-ai-app \
          --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/healthcare-ai-app:${{ github.sha }} \
          --platform managed \
          --region us-central1 \
          --allow-unauthenticated \
          --port 8080