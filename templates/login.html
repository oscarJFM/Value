<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | NHS Shortage Rescue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --nhs-blue: #005EB8;
            --nhs-dark-blue: #003087;
            --nhs-light-blue: #41B6E6;
            --nhs-aqua: #00A499;
            --nhs-red: #DA291C;
            --nhs-pale-grey: #E8EDEE;
            --nhs-mid-grey: #768692;
            --nhs-dark-grey: #425563;
            --nhs-white: #FFFFFF;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, var(--nhs-dark-blue) 0%, var(--nhs-blue) 50%, var(--nhs-aqua) 100%);
        }
        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .login-card {
            background: var(--nhs-white);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 420px;
            overflow: hidden;
        }
        .login-header {
            background: var(--nhs-dark-blue);
            padding: 2rem 2.5rem 1.75rem;
            text-align: center;
        }
        .login-header .brand {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--nhs-white);
            margin-bottom: 0.25rem;
        }
        .login-header .brand span { color: var(--nhs-light-blue); }
        .login-header .subtitle {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.6);
        }
        .login-header .shield {
            width: 56px;
            height: 56px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
        }
        .login-header .shield svg {
            width: 28px;
            height: 28px;
            stroke: var(--nhs-light-blue);
        }
        .login-body {
            padding: 2rem 2.5rem 2.5rem;
        }
        .form-label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--nhs-dark-grey);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 0.35rem;
        }
        .form-control {
            border-radius: 8px;
            border: 1.5px solid #d5dce0;
            padding: 0.65rem 0.9rem;
            font-size: 0.9rem;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-control:focus {
            border-color: var(--nhs-blue);
            box-shadow: 0 0 0 3px rgba(0,94,184,0.15);
        }
        .btn-login {
            background: var(--nhs-blue);
            color: #fff;
            border: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 8px;
            padding: 0.7rem;
            width: 100%;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }
        .btn-login:hover { background: var(--nhs-dark-blue); color: #fff; }
        .alert-box {
            background: rgba(218,41,28,0.08);
            border: 1px solid rgba(218,41,28,0.2);
            color: var(--nhs-red);
            border-radius: 8px;
            padding: 0.65rem 0.9rem;
            font-size: 0.82rem;
            font-weight: 500;
            margin-bottom: 1rem;
            text-align: center;
        }
        .login-footer {
            text-align: center;
            padding: 1.25rem 0;
            font-size: 0.7rem;
            color: rgba(255,255,255,0.45);
        }
    </style>
</head>
<body>

<div class="login-wrapper">
    <div class="login-card">
        <div class="login-header">
            <div class="shield">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
            </div>
            <div class="brand">NHS <span>Shortage Rescue</span></div>
            <div class="subtitle">Regional Network Monitoring System</div>
        </div>
        <div class="login-body">
            {% if error %}
            <div class="alert-box">{{ error }}</div>
            {% endif %}
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-login">Sign In</button>
            </form>
        </div>
    </div>
</div>

<div class="login-footer">
    NHS Shortage Rescue &middot; AI Agent v3.2.1 &middot; Authorised Personnel Only
</div>

</body>
</html>
